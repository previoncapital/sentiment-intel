# Names whose first/last split can't be inferred from the results files, which
# list names as "Last First". Canonical form follows the City Clerk's certified
# Declaration of Results; first/last split follows the City's results file.
name_overrides:
  - results_spelling: McNally Diana Chan
    canonical_name: Diana Chan McNally
    first_name: Diana Chan
    last_name: McNally
    source: https://www.toronto.ca/wp-content/uploads/2026/10/8966-Declaration-of-Results-2026-Toronto-Municipal-Election-Oct-29-Final.pdf
