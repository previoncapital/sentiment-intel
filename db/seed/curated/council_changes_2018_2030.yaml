# Hand-checked facts about Toronto City Council seats, December 2018 onward.
#
# The general-election winners come straight from the City's official results
# files (open data). This file adds what those files can't tell us: term dates,
# and every change of seat-holder between elections (resignations, deaths,
# removals, appointments by Council, and by-elections).
#
# Every date carries a `basis` saying what kind of date it is:
#   statutory           - set by law (Municipal Elections Act)
#   official            - stated in a City record (news release, Clerk's report,
#                         by-law) or in the resignation notice it reports
#   first_council_meeting - first Council meeting attended; used for by-election
#                         winners, who take the oath at the next meeting
#   reported            - from news coverage only; not yet confirmed in a City record
# and `confidence`: high / medium / low.
#
# Cross-checks against the City's Council attendance and voting data are run
# by db/seed/build/build_people_and_wards.py.

terms:
  - term: "2018-2022"
    start: 2018-12-01
    start_basis: statutory
    start_confidence: medium
    start_note: >-
      Legal start of the term under the Municipal Elections Act as it applied to
      the 2018 election (terms began December 1; from 2022, November 15). The
      inaugural meeting, where members made their declarations of office, was
      2018-12-04. Not yet confirmed in a City record.
    end: 2022-11-14
    end_basis: statutory
    end_confidence: high
    general_election: 2018-10-22
  - term: "2022-2026"
    start: 2022-11-15
    start_basis: statutory
    start_confidence: high
    start_note: City By-law 954-2022 and City news release on the 2022-2026 term.
    sources:
      - https://www.toronto.ca/legdocs/bylaws/2022/law0954.pdf
      - https://www.toronto.ca/news/city-of-toronto-ushers-in-the-2022-2026-council-term/
    end: 2026-11-14
    end_basis: statutory
    end_confidence: high
    general_election: 2022-10-24
  - term: "2026-2030"
    start: 2026-11-15
    start_basis: statutory
    start_confidence: high
    end: 2030-11-14
    end_basis: statutory
    end_confidence: high
    general_election: 2026-10-26
    sources:
      - https://www.toronto.ca/wp-content/uploads/2026/10/8966-Declaration-of-Results-2026-Toronto-Municipal-Election-Oct-29-Final.pdf

# Changes between general elections, in date order.
# kind: left (resigned / died / removed) or joined (appointed / by-election).
changes:
  # ---------------- 2018-2022 term ----------------
  # Jim Karygiannis was removed and reinstated twice over his 2018 campaign
  # expenses before the removal became final. Council attendance matches this:
  # he attended every meeting through 2020-05-28 (no meeting fell between Nov 6
  # and Nov 25, 2019) and none from 2020-06-29 on (no meeting fell in the
  # Aug 5 - Sept 24, 2020 stay period).
  - person: Jim Karygiannis
    office: councillor
    ward: 22
    kind: left
    reason: removed_from_office
    date: 2019-11-06
    basis: reported
    confidence: high
    note: Removed by the City Clerk after review of 2018 campaign expenses.
    sources:
      - https://globalnews.ca/news/6216018/jim-karygiannis-ontario-superior-court-decision
  - person: Jim Karygiannis
    office: councillor
    ward: 22
    kind: joined
    reason: reinstated_by_court
    date: 2019-11-25
    basis: reported
    confidence: high
    note: Reinstated by Ontario Superior Court (Justice Chalmers).
    sources:
      - https://www.cp24.com/news/judge-returns-jim-karygiannis-to-city-council-seat-1.4701857
  - person: Jim Karygiannis
    office: councillor
    ward: 22
    kind: left
    reason: removed_from_office
    date: 2020-06-24
    basis: reported
    confidence: high
    note: Court of Appeal ruled the Superior Court lacked jurisdiction; seat forfeited.
    sources:
      - https://www.cbc.ca/news/canada/toronto/karygiannis-court-of-appeal-ruling-1.5625157
  - person: Jim Karygiannis
    office: councillor
    ward: 22
    kind: joined
    reason: reinstated_by_court
    date: 2020-08-05
    basis: reported
    confidence: medium
    note: >-
      Court of Appeal stayed its ruling pending his Supreme Court leave
      application. Date is the first news report; the order may be a day earlier.
    sources:
      - https://globalnews.ca/news/7252918/jim-karygiannis-ontario-court-of-appeal-stay
  - person: Jim Karygiannis
    office: councillor
    ward: 22
    kind: left
    reason: removed_from_office
    date: 2020-09-24
    basis: reported
    confidence: high
    note: Supreme Court of Canada refused leave to appeal; seat vacant from this date.
    sources:
      - https://www.yorku.ca/osgoode/thecourt/2020/10/14/james-karygiannis-v-city-of-toronto-a-denial-at-the-scc-ends-a-two-year-saga/
  - person: Nick Mantas
    office: councillor
    ward: 22
    kind: joined
    reason: by_election
    date: 2021-01-18
    basis: reported
    confidence: medium
    note: By-election 2021-01-15; sworn in (declaration of office) 2021-01-18.
    sources:
      - https://globalnews.ca/news/7579916/nick-mantas-ward-22-scarborough-agincourt-byelection
  - person: Joe Cressy
    office: councillor
    ward: 10
    kind: left
    reason: resigned
    date: 2022-04-30
    basis: official
    confidence: high
    sources:
      - https://www.toronto.ca/legdocs/mmis/2022/cc/bgrd/backgroundfile-225425.pdf
  - person: Kristyn Wong-Tam
    office: councillor
    ward: 13
    kind: left
