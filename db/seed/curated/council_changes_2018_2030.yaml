    confidence: high
    note: Resigned to run in the 2022 provincial election.
    sources:
      - https://www.toronto.ca/legdocs/mmis/2022/cc/bgrd/backgroundfile-225425.pdf
  - person: Joe Mihevc
    office: councillor
    ward: 10
    kind: joined
